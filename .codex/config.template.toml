# Generated by scripts/setup-agent-tooling.ps1. Do not store credentials here.

[mcp_servers.planner]
command = "node"
args = ["__PLANNER_ENTRYPOINT__"]
cwd = "__PROJECT_ROOT__"
enabled = true
required = true
startup_timeout_sec = 10
tool_timeout_sec = 30

[mcp_servers.planner.env]
PLANNER_PROJECT_ROOT = "__PROJECT_ROOT__"
PLANNER_CONSUMER_PROJECT_ROOT = "__PROJECT_ROOT__"
PLANNER_STORAGE_MODE = "in-repo"
PLANNER_TRACKER_EXTENDED = "0"
NODE_NO_WARNINGS = "1"

[mcp_servers.vault]
command = "node"
args = ["__VAULT_ENTRYPOINT__"]
cwd = "__PROJECT_ROOT__"
startup_timeout_sec = 120
tool_timeout_sec = 120
required = true

[mcp_servers.vault.env]
VAULT_CONFIG = "__VAULT_CONFIG__"
QMD_LLAMA_GPU = "vulkan"
GGML_VK_VISIBLE_DEVICES = "0"
